<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
    <h2>PetCare Clinic</h2>
    <p class="small-text">Receptionist Panel</p>
    <nav>
        <a href="index.html" >Dashboard</a>
        <a href="owners.html" >Pet Owners</a>
        <a href="pets.html" >Pets</a>
        <a href="appointments.html" >Appointments</a>
        <a href="billing.html" class="active">Billing</a>
        <a href="reports.html" >Reports</a>
    </nav>
</aside>

    <main class="main">
        <header class="header">
            <h1>Billing Management</h1>
            <p>Welcome, Receptionist!</p>
        </header>

        <section class="appointment-section">
            <h2>Generate New Bill</h2>
            <form id="billingForm">
                <label for="billPet">Select Pet</label>
                <select id="billPet" required>
                    <option value="">Select Pet</option>
                </select>

                <label for="billOwner">Owner Name</label>
                <input type="text" id="billOwner" readonly>

                <label for="consultationFee">Consultation Fee (₹)</label>
                <input type="number" id="consultationFee" value="300" min="0" required>

                <label for="medicineFee">Medicine Charges (₹)</label>
                <input type="number" id="medicineFee" value="0" min="0" required>

                <label for="otherFee">Other Charges (₹)</label>
                <input type="number" id="otherFee" value="0" min="0" required>

                <label for="paymentStatus">Payment Status</label>
                <select id="paymentStatus" required>
                    <option value="Paid">Paid</option>
                    <option value="Pending">Pending</option>
                </select>

                <button type="submit">Generate Bill</button>
            </form>
        </section>

        <section class="appointment-section">
            <h2>Billing Records</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Bill ID</th>
                            <th>Pet Name</th>
                            <th>Owner</th>
                            <th>Consultation</th>
                            <th>Medicine</th>
                            <th>Other</th>
                            <th>Total Amount</th>
                            <th>Payment</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="billList"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
