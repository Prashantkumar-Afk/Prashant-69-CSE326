<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
    <h2>PetCare Clinic</h2>
    <p class="small-text">Receptionist Panel</p>
    <nav>
        <a href="index.html" >Dashboard</a>
        <a href="owners.html" >Pet Owners</a>
        <a href="pets.html" class="active">Pets</a>
        <a href="appointments.html" >Appointments</a>
        <a href="billing.html" >Billing</a>
        <a href="reports.html" >Reports</a>
    </nav>
</aside>

    <main class="main">
        <header class="header">
            <h1>Pet Management</h1>
            <p>Welcome, Receptionist!</p>
        </header>

        <section class="appointment-section">
            <h2>Register New Pet</h2>
            <form id="petForm">
                <label for="petName">Pet Name</label>
                <input type="text" id="petName" placeholder="Enter pet name" required>

                <label for="petType">Pet Type</label>
                <select id="petType" required>
                    <option value="">Select Pet Type</option>
                    <option value="Dog">Dog</option>
                    <option value="Cat">Cat</option>
                    <option value="Bird">Bird</option>
                    <option value="Rabbit">Rabbit</option>
                    <option value="Other">Other</option>
                </select>

                <label for="breed">Breed</label>
                <input type="text" id="breed" placeholder="Enter breed" required>

                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter age in years" min="0" required>

                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

                <label for="petOwner">Pet Owner</label>
                <select id="petOwner" required>
                    <option value="">Select Owner</option>
                </select>

                <button type="submit">Register Pet</button>
            </form>
        </section>

        <section class="appointment-section">
            <h2>Registered Pets</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Pet ID</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Breed</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Owner</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="petList"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
