
<!DOCTYPE html>
<html>
<head>
    <title>Pet Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>PetCare Clinic</h2>
        <p class="small-text">Receptionist Panel</p>

        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="owners.html">Pet Owners</a></li>
            <li><a href="pets.html" class="active">Pets</a></li>
            <li><a href="appointments.html">Appointments</a></li>
            <li><a href="billing.html">Billing</a></li>
            <li><a href="reports.html">Reports</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main">

        <div class="header">
            <h2>Pet Management</h2>
            <p>Welcome, Receptionist!</p>
        </div>

        <!-- Pet Registration Form -->
        <div class="appointment-section">

            <h2>Register New Pet</h2>

            <form id="petForm">

                <label>Pet Name</label>
                <input type="text" id="petName"
                placeholder="Enter pet name" required>

                <label>Pet Type</label>
                <select id="petType" required>
                    <option value="">Select Pet Type</option>
                    <option value="Dog">Dog</option>
                    <option value="Cat">Cat</option>
                    <option value="Bird">Bird</option>
                    <option value="Rabbit">Rabbit</option>
                    <option value="Other">Other</option>
                </select>

                <label>Breed</label>
                <input type="text" id="breed"
                placeholder="Enter breed" required>

                <label>Age</label>
                <input type="number" id="age"
                placeholder="Enter age in years" min="0" required>

                <label>Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

                <label>Pet Owner</label>
                <select id="petOwner" required>
                    <option value="">Select Owner</option>
                </select>

                <button type="submit">Register Pet</button>

            </form>

        </div>

        <!-- Registered Pets -->
        <div class="appointment-section">

            <h2>Registered Pets</h2>

            <table>
                <thead>
                    <tr>
                        <th>Pet ID</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Breed</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Owner</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="petList"></tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
