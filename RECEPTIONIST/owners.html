
<!DOCTYPE html>
<html>
<head>
    <title>Pet Owner Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>PetCare Clinic</h2>
        <p class="small-text">Receptionist Panel</p>

        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="owners.html" class="active">Pet Owners</a></li>
            <li><a href="pets.html">Pets</a></li>
            <li><a href="appointments.html">Appointments</a></li>
            <li><a href="billing.html">Billing</a></li>
            <li><a href="reports.html">Reports</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main">

        <div class="header">
            <h2>Pet Owner Management</h2>
            <p>Welcome, Receptionist!</p>
        </div>

        <!-- Owner Registration Form -->
        <div class="appointment-section">

            <h2>Register New Owner</h2>

            <form id="ownerForm">

                <label>Owner Name</label>
                <input type="text" id="ownerName"
                placeholder="Enter owner name" required>

                <label>Phone Number</label>
                <input type="tel" id="phone"
                placeholder="Enter phone number" required>

                <label>Email Address</label>
                <input type="email" id="email"
                placeholder="Enter email address">

                <label>Address</label>
                <textarea id="address"
                placeholder="Enter address"></textarea>

                <button type="submit">Register Owner</button>

            </form>

        </div>

        <!-- Owner List -->
        <div class="appointment-section">

            <h2>Registered Owners</h2>

             <input
             type="text"
             id="searchOwner"
             placeholder="Search owner by name or phone...">


            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="ownerList">
                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
