<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Owner Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
    <h2>PetCare Clinic</h2>
    <p class="small-text">Receptionist Panel</p>
    <nav>
        <a href="index.html" >Dashboard</a>
        <a href="owners.html" class="active">Pet Owners</a>
        <a href="pets.html" >Pets</a>
        <a href="appointments.html" >Appointments</a>
        <a href="billing.html" >Billing</a>
        <a href="reports.html" >Reports</a>
    </nav>
</aside>

    <main class="main">
        <header class="header">
            <h1>Pet Owner Management</h1>
            <p>Welcome, Receptionist!</p>
        </header>

        <section class="appointment-section">
            <h2>Register New Owner</h2>
            <form id="ownerForm">
                <label for="ownerName">Owner Name</label>
                <input type="text" id="ownerName" placeholder="Enter owner name" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter email address">

                <label for="address">Address</label>
                <textarea id="address" placeholder="Enter address"></textarea>

                <button type="submit">Register Owner</button>
            </form>
        </section>

        <section class="appointment-section">
            <h2>Registered Owners</h2>
            <label for="searchOwner">Search by name or phone number</label>
            <input type="text" id="searchOwner" placeholder="Type a name or phone number">

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ownerList"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
